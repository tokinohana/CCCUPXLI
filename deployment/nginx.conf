server {
    listen 80;
    server_name cccup.id;

    client_max_body_size 10M;

    root /var/www/cccup;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /regis/ {
        alias /var/www/cccup/regis/;
        try_files $uri $uri/ /regis/index.html;
    }

    location /ccpay/ {
        alias /var/www/cccup/ccpay/;
        try_files $uri $uri/ /ccpay/index.html;
    }

    location /ticketing/ {
        alias /var/www/cccup/ticketing/;
        try_files $uri $uri/ /ticketing/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/benhal/apps/cccupxli/cc_cup_xli/staticfiles/;
        expires 30d;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}